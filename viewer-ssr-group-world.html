<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found]){display:none!important}</style></head><body>
<title>SSR Group World</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&family=Carlito:wght@400;700&display=swap">
<style>
  :root{
    --navy:#0E2038; --navy-2:#16304F; --glass:rgba(12,26,46,.84); --glass-soft:rgba(12,26,46,.62);
    --gold:#C9A24B; --gold-soft:#E3C57E; --ink:#F3EDE0; --muted:#9DB0C6; --line:rgba(201,162,75,.35);
    --teal:#4FB3A9;
    --serif:Cambria,'Source Serif 4',Georgia,serif;
    --sans:Calibri,'Carlito','Segoe UI',sans-serif;
  }
  html,body{height:100%;}
  body{margin:0;background:var(--navy);color:var(--ink);font-family:var(--sans);overflow:hidden;}
  #stage{position:fixed;inset:0;}
  #stage canvas{display:block;}

  /* ---------- splash ---------- */
  #splash{position:fixed;inset:0;background:var(--navy);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:60;transition:opacity .8s ease;}
  #splash.gone{opacity:0;pointer-events:none;}
  #splash .mark{font-family:var(--serif);font-size:34px;letter-spacing:.08em;color:var(--gold);}
  #splash .sub{color:var(--muted);letter-spacing:.24em;text-transform:uppercase;font-size:11px;}
  #splash .bar{width:180px;height:2px;background:rgba(201,162,75,.2);overflow:hidden;border-radius:2px;}
  #splash .bar i{display:block;height:100%;width:40%;background:var(--gold);animation:load 1.1s infinite ease-in-out;}
  @keyframes load{0%{transform:translateX(-100%);}100%{transform:translateX(280%);}}

  /* ---------- top bar ---------- */
  #topbar{position:fixed;top:0;left:0;right:0;display:flex;align-items:baseline;justify-content:space-between;
    padding:12px 18px;z-index:20;pointer-events:none;background:linear-gradient(rgba(8,18,32,.65),rgba(8,18,32,0));}
  #topbar .brand{font-family:var(--serif);font-size:20px;letter-spacing:.06em;color:var(--ink);}
  #topbar .brand b{color:var(--gold);font-weight:600;}
  #topbar .tag{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);}
  @media(max-width:640px){#topbar .tag{display:none;}}

  /* ---------- mode dock ---------- */
  #dock{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:6px;z-index:25;
    background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:6px;backdrop-filter:blur(8px);}
  #dock button{font-family:var(--sans);font-size:13px;letter-spacing:.04em;border:0;background:transparent;color:var(--muted);
    padding:9px 16px;border-radius:999px;cursor:pointer;white-space:nowrap;}
  #dock button.on{background:var(--gold);color:#14243C;font-weight:700;}
  #dock button:focus-visible{outline:2px solid var(--gold-soft);outline-offset:2px;}

  /* ---------- control rail ---------- */
  #rail{position:fixed;right:12px;top:64px;width:196px;display:flex;flex-direction:column;gap:10px;z-index:20;}
  .ctl{background:var(--glass);border:1px solid var(--line);border-radius:10px;padding:10px 12px;backdrop-filter:blur(8px);}
  .ctl label{display:flex;justify-content:space-between;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;}
  .ctl label output{color:var(--gold-soft);letter-spacing:.04em;}
  .ctl input[type=range]{width:100%;accent-color:var(--gold);cursor:pointer;}
  @media(max-width:640px){#rail{top:auto;bottom:74px;right:10px;width:158px;}}

  /* ---------- info card ---------- */
  #card{position:fixed;left:14px;bottom:74px;width:290px;max-width:calc(100vw - 190px);background:var(--glass);
    border:1px solid var(--line);border-radius:12px;padding:16px 18px;z-index:22;backdrop-filter:blur(8px);
    transform:translateY(12px);opacity:0;pointer-events:none;transition:.35s ease;}
  #card.show{transform:none;opacity:1;pointer-events:auto;}
  #card h2{font-family:var(--serif);font-size:19px;margin:0 0 2px;color:var(--gold-soft);font-weight:600;}
  #card .kicker{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;}
  #card p{font-size:13px;line-height:1.5;margin:0 0 10px;color:var(--ink);}
  #card .facts{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:12px;margin-bottom:10px;}
  #card .facts b{color:var(--muted);font-weight:400;}
  #card .facts span{color:var(--ink);font-variant-numeric:tabular-nums;}
  #card .act{display:flex;gap:8px;flex-wrap:wrap;}
  #card .act button{font-family:var(--sans);font-size:12px;border:1px solid var(--gold);background:transparent;color:var(--gold-soft);
    border-radius:8px;padding:7px 12px;cursor:pointer;}
  #card .act button.primary{background:var(--gold);color:#14243C;font-weight:700;}
  #card .close{position:absolute;top:8px;right:10px;background:none;border:0;color:var(--muted);font-size:16px;cursor:pointer;padding:4px;}
  .legend{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;}
  .legend i{display:inline-flex;align-items:center;gap:5px;font-style:normal;font-size:11px;color:var(--ink);}
  .legend i::before{content:"";width:10px;height:10px;border-radius:2px;background:var(--c);}

  /* ---------- caption (tour) ---------- */
  #caption{position:fixed;left:50%;bottom:72px;transform:translateX(-50%);max-width:min(560px,86vw);text-align:center;
    background:var(--glass);border:1px solid var(--line);border-radius:10px;padding:12px 20px;z-index:24;
    opacity:0;transition:opacity .5s;pointer-events:none;}
  #caption.show{opacity:1;}
  #caption .t{font-family:var(--serif);font-size:16px;color:var(--gold-soft);margin-bottom:2px;}
  #caption .d{font-size:13px;color:var(--ink);line-height:1.45;}

  /* ---------- interior HUD ---------- */
  #joy{position:fixed;left:22px;bottom:86px;width:104px;height:104px;border-radius:50%;border:1px solid var(--line);
    background:var(--glass-soft);z-index:26;display:none;touch-action:none;}
  #joy .nub{position:absolute;left:50%;top:50%;width:44px;height:44px;border-radius:50%;background:var(--gold);
    transform:translate(-50%,-50%);opacity:.85;}
  #hint{position:fixed;top:60px;left:50%;transform:translateX(-50%);background:var(--glass);border:1px solid var(--line);
    border-radius:8px;padding:7px 14px;font-size:12px;color:var(--muted);z-index:21;opacity:0;transition:opacity .5s;pointer-events:none;}
  #hint.show{opacity:1;}

  #foot{position:fixed;right:14px;bottom:14px;z-index:18;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:rgba(157,176,198,.75);pointer-events:none;}
  @media(max-width:640px){#foot{display:none;}}
</style>

<div id="stage"></div>

<div id="splash">
  <div class="mark">SSR GROUP <b style="color:var(--ink)">WORLD</b></div>
  <div class="sub">Building the world</div>
  <div class="bar"><i></i></div>
</div>

<div id="topbar">
  <div class="brand">SSR <b>GROUP</b> WORLD</div>
  <div class="tag">Interactive 3D Showcase · SSR Group Civil</div>
</div>

<div id="dock">
  <button id="bExplore" class="on">Explore</button>
  <button id="bTour">Guided tour</button>
  <button id="bInside">Step inside</button>
</div>

<div id="rail">
  <div class="ctl" id="ctlTime">
    <label>Time of day <output id="oTime">Noon</output></label>
    <input type="range" id="sTime" min="0" max="1000" value="380" aria-label="Time of day">
  </div>
  <div class="ctl" id="ctlBuild">
    <label>Construction <output id="oBuild">62%</output></label>
    <input type="range" id="sBuild" min="0" max="1000" value="620" aria-label="Construction progress">
  </div>
  <div class="ctl" id="ctlPeel">
    <label>Hospital peel <output id="oPeel">Closed</output></label>
    <input type="range" id="sPeel" min="0" max="1000" value="0" aria-label="Hospital floor peel">
  </div>
</div>

<div id="card">
  <button class="close" id="cardClose" aria-label="Close">✕</button>
  <div class="kicker" id="cardKicker"></div>
  <h2 id="cardTitle"></h2>
  <div id="cardBody"></div>
</div>

<div id="caption"><div class="t" id="capT"></div><div class="d" id="capD"></div></div>
<div id="joy"><div class="nub" id="joyNub"></div></div>
<div id="hint"></div>
<div id="foot">Demonstration model · dimensions representative</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* =====================================================================
   SSR GROUP WORLD — single-file interactive 3D showcase
   World scale: 1 unit = 1 metre. Floor height 3.0 m.
   ===================================================================== */
(function(){
'use strict';
var $ = function(id){ return document.getElementById(id); };

/* ---------- renderer ---------- */
var stage = $('stage');
var renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
stage.appendChild(renderer.domElement);

/* ---------- scenes ---------- */
var world = new THREE.Scene();
var home  = new THREE.Scene();
home.background = new THREE.Color(0xBFDDF2);
home.fog = new THREE.Fog(0xBFDDF2, 40, 120);
var camera = new THREE.PerspectiveCamera(55, window.innerWidth/window.innerHeight, 0.1, 1600);

/* ---------- sky / lights (world) ---------- */
var hemi = new THREE.HemisphereLight(0xbfd6ea, 0x33414f, 0.85); world.add(hemi);
var sun = new THREE.DirectionalLight(0xffffff, 1.1);
sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-190; sun.shadow.camera.right=190;
sun.shadow.camera.top=190; sun.shadow.camera.bottom=-190;
sun.shadow.camera.far=700; sun.shadow.bias=-0.0015;
world.add(sun); world.add(sun.target);
world.fog = new THREE.Fog(0xbfd6ea, 260, 900);

/* ---------- helpers ---------- */
function mat(c, opt){ var m=new THREE.MeshLambertMaterial(Object.assign({color:c},opt||{})); return m; }
function box(w,h,d,m,x,y,z,parent){
  var g=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);
  g.position.set(x,y,z); g.castShadow=true; g.receiveShadow=true; (parent||world).add(g); return g;
}
function canvasTex(w,h,draw){
  var c=document.createElement('canvas'); c.width=w; c.height=h;
  draw(c.getContext('2d'),w,h);
  var t=new THREE.CanvasTexture(c); return t;
}

/* =====================================================================
   GROUND, ROADS, LANDSCAPE
   ===================================================================== */
var groundTex = canvasTex(1024,1024,function(g){
  g.fillStyle='#5e7d4f'; g.fillRect(0,0,1024,1024);
  for(var i=0;i<9000;i++){ g.fillStyle='rgba('+(70+Math.random()*40|0)+','+(105+Math.random()*40|0)+','+(60+Math.random()*30|0)+',0.5)';
    g.fillRect(Math.random()*1024,Math.random()*1024,3,3); }
});
groundTex.wrapS=groundTex.wrapT=THREE.RepeatWrapping; groundTex.repeat.set(8,8);
var ground = new THREE.Mesh(new THREE.PlaneGeometry(1200,1200), new THREE.MeshLambertMaterial({map:groundTex}));
ground.rotation.x=-Math.PI/2; ground.receiveShadow=true; world.add(ground);

function road(w,l,x,z,rot){
  var t=canvasTex(256,1024,function(g){
    g.fillStyle='#3d4145'; g.fillRect(0,0,256,1024);
    g.strokeStyle='#d8d3c2'; g.lineWidth=6; g.setLineDash([40,36]);
    g.beginPath(); g.moveTo(128,0); g.lineTo(128,1024); g.stroke();
  });
  t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(1,l/28);
  var r=new THREE.Mesh(new THREE.PlaneGeometry(w,l), new THREE.MeshLambertMaterial({map:t}));
  r.rotation.x=-Math.PI/2; r.rotation.z=rot||0; r.position.set(x,0.02,z); r.receiveShadow=true; world.add(r);
}
road(10,560,0,0,0);            // main boulevard N-S
road(10,480,0,-10,Math.PI/2);  // cross avenue E-W
road(8,220,-120,60,0);         // hospital spur

/* pavements around plaza */
var plaza = new THREE.Mesh(new THREE.CircleGeometry(26,40), mat(0xb9ab8e));
plaza.rotation.x=-Math.PI/2; plaza.position.set(40,0.03,-64); plaza.receiveShadow=true; world.add(plaza);

/* trees — instanced */
(function(){
  var trunkG=new THREE.CylinderGeometry(0.28,0.4,2.6,6);
  var headG=new THREE.IcosahedronGeometry(2.1,0);
  var trunkM=mat(0x6b4a2e), headM=mat(0x3f6b35);
  var N=170;
  var trunks=new THREE.InstancedMesh(trunkG,trunkM,N);
  var heads=new THREE.InstancedMesh(headG,headM,N);
  trunks.castShadow=true; heads.castShadow=true;
  var m4=new THREE.Matrix4(), p=new THREE.Vector3(), q=new THREE.Quaternion(), s=new THREE.Vector3();
  var i=0, guard=0;
  while(i<N && guard++<4000){
    var x=(Math.random()*2-1)*260, z=(Math.random()*2-1)*260;
    if(Math.abs(x)<9||Math.abs(z+10)<9) continue;                       // roads
    if(x>18&&x<126&&z>-150&&z<30) continue;                             // towers zone
    if(x>-60&&x<-8&&z>-96&&z<-44) continue;                             // sports green + track
    if(x<-52&&x>-190&&z>10&&z<130) continue;                            // hospital zone
    if(x>8&&x<78&&z>-96&&z<-34) continue;                               // plaza/club
    var sc=0.7+Math.random()*0.9;
    q.setFromAxisAngle(new THREE.Vector3(0,1,0),Math.random()*6.28);
    p.set(x,1.3*sc,z); s.set(sc,sc,sc); m4.compose(p,q,s); trunks.setMatrixAt(i,m4);
    p.set(x,(2.6+1.4)*sc,z); m4.compose(p,q,s); heads.setMatrixAt(i,m4);
    i++;
  }
  trunks.count=i; heads.count=i;
  world.add(trunks); world.add(heads);
})();

/* street lamps */
var lampHeads=[];
for(var li=0; li<14; li++){
  var lx = (li%2? 7.5 : -7.5), lz = -240 + li*36;
  var pole=box(0.22,7,0.22,mat(0x2c3540),lx,3.5,lz);
  var head=box(1.4,0.3,0.5,new THREE.MeshLambertMaterial({color:0x30393f,emissive:0xffd98a,emissiveIntensity:0}),lx,7,lz);
  lampHeads.push(head);
}

/* =====================================================================
   FACADE TEXTURES (day map + night emissive map)
   ===================================================================== */
function facadeTex(floors, cols, opts){
  opts=opts||{};
  var W=cols*34, H=floors*30;
  var day=canvasTex(W,H,function(g){
    g.fillStyle=opts.wall||'#cfc7b8'; g.fillRect(0,0,W,H);
    for(var f=0;f<floors;f++){
      // floor band
      g.fillStyle=opts.band||'#b3a893'; g.fillRect(0,f*30,W,3);
      for(var c=0;c<cols;c++){
        var x=c*34+6, y=f*30+7;
        g.fillStyle=opts.glass||'#7fa6bd'; g.fillRect(x,y,22,17);
        g.fillStyle='rgba(255,255,255,0.35)'; g.fillRect(x,y,22,5);
        g.strokeStyle='#5b6a75'; g.lineWidth=1.4; g.strokeRect(x,y,22,17);
      }
    }
  });
  var night=canvasTex(W,H,function(g){
    g.fillStyle='#000'; g.fillRect(0,0,W,H);
    for(var f=0;f<floors;f++) for(var c=0;c<cols;c++){
      if(Math.random()<(opts.lit||0.55)){
        g.fillStyle=Math.random()<0.82?'#ffd98a':'#fff3d0';
        g.fillRect(c*34+6,f*30+7,22,17);
      }
    }
  });
  return {day:day, night:night};
}
var nightMats=[];   // materials whose emissiveIntensity follows night
function facadeMat(floors, cols, opts){
  var t=facadeTex(floors, cols, opts);
  var m=new THREE.MeshLambertMaterial({map:t.day, emissive:new THREE.Color(0xffffff), emissiveMap:t.night, emissiveIntensity:0});
  nightMats.push(m); return m;
}

/* =====================================================================
   RESIDENTIAL CLUSTER — Towers I, J, K  (G+14, 45 m)
   ===================================================================== */
var FLOOR_H=3.0;
function tower(name,x,z,floors,w,d,opts){
  var grp=new THREE.Group(); grp.position.set(x,0,z); world.add(grp);
  var h=floors*FLOOR_H;
  var side=facadeMat(floors,Math.round(w/2.6),opts);
  var side2=facadeMat(floors,Math.round(d/2.6),opts);
  var roof=mat(0x8e8676);
  var bodyMats=[side2,side2,roof,roof,side,side]; // +x,-x,+y,-y,+z,-z
  var body=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),bodyMats);
  body.position.y=h/2; body.castShadow=true; body.receiveShadow=true; grp.add(body);
  // podium + parapet + core bump
  box(w+4,1.2,d+4,mat(0xb9ab8e),0,0.6,0,grp);
  box(w*0.34,2.6,d*0.34,mat(0xa79b85),0,h+1.3,0,grp);
  box(w+0.4,0.8,d+0.4,mat(0xa79b85),0,h+0.4,0,grp);
  grp.userData={name:name,h:h};
  return grp;
}
var towerI=tower('Tower I', 46,-118,15,20,16,{wall:'#d9d2c4'});
var towerJ=tower('Tower J', 84,-118,15,20,16,{wall:'#d9d2c4'});
var towerK=tower('Tower K', 65,-72, 15,20,16,{wall:'#cfc7b8'});

/* =====================================================================
   AURA RISE — construction tower (G+21, 66 m) with stage slider + crane
   ===================================================================== */
var C_FLOORS=22, CW=24, CD=18;
var conGroup=new THREE.Group(); conGroup.position.set(72,0,-8); world.add(conGroup);
box(CW+5,1.2,CD+5,mat(0xb9ab8e),0,0.6,0,conGroup);
var conFloors=[];
var mConc=mat(0xb9b3a6), mCol=mat(0xa8a294), mBrick=mat(0xb0603f), mCore=mat(0x9a9488);
var finMatA=facadeMat(1,Math.round(CW/2.6),{wall:'#c8d2d8',glass:'#6f9cb8'});
var finMatB=facadeMat(1,Math.round(CD/2.6),{wall:'#c8d2d8',glass:'#6f9cb8'});
var mRoofC=mat(0x8e8676);
for(var f=0; f<C_FLOORS; f++){
  var fg=new THREE.Group(); fg.position.y=f*FLOOR_H; conGroup.add(fg);
  var slab=box(CW,0.28,CD,mConc,0,FLOOR_H-0.14,0,fg);
  var cols=new THREE.Group(); fg.add(cols);
  for(var cx=-1;cx<=1;cx++) for(var cz=-1;cz<=1;cz+=2)
    box(0.55,FLOOR_H-0.28,0.55,mCol,cx*(CW/2-1.2),(FLOOR_H-0.28)/2,cz*(CD/2-1.2),cols);
  var core=box(4.2,FLOOR_H-0.28,3.4,mCore,0,(FLOOR_H-0.28)/2,0,fg);
  var brick=box(CW-0.6,FLOOR_H-0.5,CD-0.6,mBrick,0,(FLOOR_H-0.5)/2+0.05,0,fg);
  var fin=new THREE.Mesh(new THREE.BoxGeometry(CW+0.05,FLOOR_H,CD+0.05),[finMatB,finMatB,mRoofC,mRoofC,finMatA,finMatA]);
  fin.position.y=FLOOR_H/2; fin.castShadow=true; fg.add(fin);
  conFloors.push({g:fg,slab:slab,cols:cols,core:core,brick:brick,fin:fin});
}
/* crane */
var crane=new THREE.Group(); conGroup.add(crane);
var craneM=mat(0xd8b13a);
box(1.1,30,1.1,craneM,CW/2+5,15,0,crane);
var craneTop=new THREE.Group(); crane.add(craneTop);
craneTop.position.set(CW/2+5,30,0);
box(26,0.9,0.9,craneM,-6,0.45,0,craneTop);   // jib
box(6,0.9,0.9,craneM,9,0.45,0,craneTop);     // counter-jib
box(1.6,1.6,1.6,mat(0x4a4f57),3.2,-0.4,0,craneTop); // counterweight
box(0.12,7,0.12,mat(0x333),-14,-3.5,0,craneTop);    // cable
box(1.2,1.2,1.2,mat(0x8a4b2f),-14,-7.4,0,craneTop); // load

function setConstruction(s){ // s 0..1
  var p=s*(C_FLOORS+9.001);
  for(var i=0;i<C_FLOORS;i++){
    var F=conFloors[i];
    var st=p>i, br=p>i+4, fi=p>i+8;
    F.g.visible=st;
    F.brick.visible=br&&!fi;
    F.fin.visible=fi;
    F.slab.visible=!fi; F.cols.visible=!fi; F.core.visible=!fi;
  }
  var topStruct=Math.min(C_FLOORS,Math.max(1,Math.ceil(p)));
  crane.visible=s<0.985;
  crane.position.y=0;
  crane.children[0].scale.y=(topStruct*FLOOR_H+8)/30;
  crane.children[0].position.y=(topStruct*FLOOR_H+8)/2;
  craneTop.position.y=topStruct*FLOOR_H+8;
  craneTop.rotation.y=performance.now()*0.00008;
}

/* =====================================================================
   HOSPITAL — G+4 + basement, floor-peel
   ===================================================================== */
var hosp=new THREE.Group(); hosp.position.set(-120,0,64); world.add(hosp);
var HW=44, HD=30, H_FLOORS=5;
var deptColors={emergency:0xd05540,opd:0x2fa89a,wards:0x5c8fd0,icu:0xd9a83a,admin:0x8f7cc9,services:0x7f858e,parking:0x5c636e};
/* basement pit */
box(HW+8,0.4,HD+8,mat(0xb9ab8e),0,0.2,0,hosp);
var pit=box(HW,3,HD,mat(0x565b63),0,-1.5,0,hosp); pit.receiveShadow=true;
function deptLayout(fg, plan){ // plan: [{c,x,z,w,d,label}]
  plan.forEach(function(pz){

function setPeel(t){ // 0 closed … 1 fully peeled to ground
  var shellFade=Math.min(1,t*3.2);
  shell.material.forEach(function(m){ m.opacity=1-shellFade; });
  shell.visible=shellFade<0.995; heli.visible=shellFade<0.6;
  var n=5; // liftable floors (1..5); basement stays
  var reach=t*n;
  hospFloors.forEach(function(F){
    if(F.idx===0) return;
    var fi=n-F.idx+1;          // top floor lifts first
    var k=Math.max(0,Math.min(1,(reach-(fi-1))));
    var e=k<0.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
    F.g.position.y=F.baseY + e*(10+(n-fi)*7.5);   // exploded stack, stays visible
  });
}

function labelSprite(text){
  var pad=26, fs=44;
  var c=document.createElement('canvas'); var g=c.getContext('2d');
  g.font='600 '+fs+'px Georgia, serif';
  var tw=g.measureText(text).width;
  c.width=tw+pad*2+30; c.height=110;
  g=c.getContext('2d');
  g.fillStyle='rgba(12,26,46,0.88)';
  var w=c.width,h=74,r=16,x=0,y=8;
  g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); g.fill();
  g.strokeStyle='rgba(201,162,75,0.9)'; g.lineWidth=3; g.stroke();
  g.beginPath(); g.moveTo(w/2-10,y+h); g.lineTo(w/2+10,y+h); g.lineTo(w/2,y+h+22); g.closePath();
  g.fillStyle='rgba(201,162,75,0.95)'; g.fill();
  g.font='600 '+fs+'px Georgia, serif'; g.fillStyle='#F3EDE0'; g.textAlign='center'; g.textBaseline='middle';
  g.fillText(text,w/2,y+h/2+2);
  var t=new THREE.CanvasTexture(c);
  var sp=new THREE.Sprite(new THREE.SpriteMaterial({map:t,depthTest:false,transparent:true}));
  sp.scale.set(c.width/16,c.height/16,1);
  return sp;
}
var hotspots=[];
function hotspot(key,text,x,y,z){
  var sp=labelSprite(text); sp.position.set(x,y,z); sp.userData.key=key; sp.renderOrder=5;
  world.add(sp); hotspots.push(sp); return sp;
}

function iwall(x1,z1,x2,z2,h,m,noCollide){
  var dx=x2-x1, dz=z2-z1, len=Math.sqrt(dx*dx+dz*dz);
  var g=new THREE.Mesh(new THREE.BoxGeometry(len,h||IH,0.12),m||iWallM);

  g.rotation.y=-Math.atan2(dz,dx);
  g.castShadow=false; g.receiveShadow=true; home.add(g);
  if(!noCollide){
    var pad=0.34;
    wallBoxes.push({minX:Math.min(x1,x2)-pad,maxX:Math.max(x1,x2)+pad,minZ:Math.min(z1,z2)-pad,maxZ:Math.max(z1,z2)+pad});
  }
  return g;
}
function ibox(w,h,d,m,x,y,z,ry){
  var g=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);

}

/* =====================================================================

   ===================================================================== */
var skyKeys=[
  {t:0.00,sky:0xf2c08a,horiz:0xE8A868,fog:0xE8B888,sun:0xffc98a,sunI:0.55,hemi:0.55},
  {t:0.35,sky:0xbfe0f5,horiz:0xDCEBF5,fog:0xC5DEF0,sun:0xfff4e0,sunI:1.15,hemi:0.9},
  {t:0.65,sky:0xaed4ee,horiz:0xE8D3B8,fog:0xC8D8E8,sun:0xffe9c4,sunI:0.95,hemi:0.8},
  {t:0.82,sky:0xE89A5F,horiz:0xC96A4A,fog:0xB98868,sun:0xffb070,sunI:0.5,hemi:0.5},
  {t:1.00,sky:0x0b1230,horiz:0x14203C,fog:0x0e1830,sun:0x8fa3bc,sunI:0.04,hemi:0.16}
];
var _cA=new THREE.Color(), _cB=new THREE.Color();
function lerpKeys(t,fld){
  for(var i=0;i<skyKeys.length-1;i++){
    var a=skyKeys[i], b=skyKeys[i+1];
    if(t>=a.t&&t<=b.t){
      var k=(t-a.t)/(b.t-a.t);
      if(typeof a[fld]==='number'&&fld!=='sky'&&fld!=='horiz'&&fld!=='fog'&&fld!=='sun'){ return a[fld]+(b[fld]-a[fld])*k; }
      _cA.setHex(a[fld]); _cB.setHex(b[fld]); return _cA.clone().lerp(_cB,k);
    }
  }
  return skyKeys[skyKeys.length-1][fld];
}
var timeVal=0.38;
function setTime(t){
  timeVal=t;
  world.background=lerpKeys(t,'sky');
  world.fog.color.copy(lerpKeys(t,'fog'));
  sun.color.copy(lerpKeys(t,'sun'));
  sun.intensity=lerpKeys(t,'sunI');
  hemi.intensity=lerpKeys(t,'hemi');
  var az=-0.9+t*2.6, el=Math.max(0.06,Math.sin(Math.min(1,t/0.86)*Math.PI)*1.05);
  sun.position.set(Math.cos(az)*260, Math.sin(el)*300+30, Math.sin(az)*260);
  var night=Math.max(0,Math.min(1,(t-0.72)/0.2));
  nightMats.forEach(function(m){ m.emissiveIntensity=night; });
  lampHeads.forEach(function(h){ h.material.emissiveIntensity=night*1.2; });
  poolWaterM.emissiveIntensity=0.15+night*0.5;
  homeWindowMat.emissive.copy(world.background); homeWindowMat.color.copy(world.background);
  var names=['Dawn','Morning','Noon','Afternoon','Dusk','Night'];
  $('oTime').textContent=names[Math.min(5,Math.floor(t*5.99))];
}

/* =====================================================================
   CAMERA CONTROLS (custom orbit + focus tween + first-person)
   ===================================================================== */
var orbit={target:new THREE.Vector3(30,14,-55),az:0.75,pol:1.04,rad:150,
           goal:{target:new THREE.Vector3(30,14,-55),az:0.75,pol:1.04,rad:150}};
if(window.innerWidth<window.innerHeight){ orbit.rad=orbit.goal.rad=260; orbit.pol=orbit.goal.pol=0.92; }
function applyOrbit(){
  var o=orbit;
  o.target.lerp(o.goal.target,0.08);
  o.az+=(o.goal.az-o.az)*0.08; o.pol+=(o.goal.pol-o.pol)*0.08; o.rad+=(o.goal.rad-o.rad)*0.08;
  var sp=Math.sin(o.pol), y=Math.cos(o.pol);
  camera.position.set(
    o.target.x+o.rad*sp*Math.cos(o.az),
    o.target.y+o.rad*y,
    o.target.z+o.rad*sp*Math.sin(o.az));
  camera.lookAt(o.target);
}
function focusOn(x,y,z,rad,az,pol){
  orbit.goal.target.set(x,y,z);
  orbit.goal.rad=rad; if(az!==undefined)orbit.goal.az=az; if(pol!==undefined)orbit.goal.pol=pol;
}
/* first-person state */
var fp={x:1.8,z:4.6,yaw:Math.PI,pitch:0,keys:{},joy:{x:0,y:0}};

/* pointer handling */
var ptrs={}, tapInfo=null, pinchD=0;
var el=renderer.domElement;
el.style.touchAction='none';
el.addEventListener('pointerdown',function(e){
  el.setPointerCapture(e.pointerId);
  ptrs[e.pointerId]={x:e.clientX,y:e.clientY};
  if(Object.keys(ptrs).length===1) tapInfo={x:e.clientX,y:e.clientY,t:performance.now()};
  if(Object.keys(ptrs).length===2){
    var k=Object.keys(ptrs); pinchD=dist2(ptrs[k[0]],ptrs[k[1]]);
  }
});
function dist2(a,b){ var dx=a.x-b.x,dy=a.y-b.y; return Math.sqrt(dx*dx+dy*dy); }
el.addEventListener('pointermove',function(e){
  var p=ptrs[e.pointerId]; if(!p) return;
  var dx=e.clientX-p.x, dy=e.clientY-p.y;
  p.x=e.clientX; p.y=e.clientY;
  var n=Object.keys(ptrs).length;
  if(mode==='inside'){
    if(n===1){ fp.yaw-=dx*0.0042; fp.pitch=Math.max(-1.2,Math.min(1.2,fp.pitch-dy*0.0032)); }
    return;
  }
  if(mode==='tour') return;
  if(n===1){
    orbit.goal.az+=dx*0.0052; orbit.az=orbit.goal.az-(orbit.goal.az-orbit.az);
    orbit.goal.pol=Math.max(0.08,Math.min(1.42,orbit.goal.pol+dy*0.0038));
  } else if(n===2){
    var k=Object.keys(ptrs), d=dist2(ptrs[k[0]],ptrs[k[1]]);
    if(pinchD>0){ orbit.goal.rad=Math.max(14,Math.min(430,orbit.goal.rad*(pinchD/d))); }
    pinchD=d;
    // two-finger pan
    var right=new THREE.Vector3(Math.sin(orbit.az+Math.PI/2)? -Math.sin(orbit.az):0,0,0);
    var fwdX=-Math.cos(orbit.az), fwdZ=-Math.sin(orbit.az);
    orbit.goal.target.x+=(-dx*fwdZ+dy*fwdX)*orbit.rad*0.0012;
    orbit.goal.target.z+=(dx*fwdX+dy*fwdZ)*orbit.rad*0.0012;
  }
});
function endPtr(e){
  delete ptrs[e.pointerId];
  if(tapInfo && Object.keys(ptrs).length===0){
    var d=Math.abs(e.clientX-tapInfo.x)+Math.abs(e.clientY-tapInfo.y);
    if(d<8 && performance.now()-tapInfo.t<400) onTap(e.clientX,e.clientY);
    tapInfo=null;
  }
}
el.addEventListener('pointerup',endPtr); el.addEventListener('pointercancel',endPtr);
el.addEventListener('wheel',function(e){
  if(mode!=='explore') return;
  orbit.goal.rad=Math.max(14,Math.min(430,orbit.goal.rad*(1+Math.sign(e.deltaY)*0.09)));
},{passive:true});
window.addEventListener('keydown',function(e){ fp.keys[e.key.toLowerCase()]=true; });
window.addEventListener('keyup',function(e){ fp.keys[e.key.toLowerCase()]=false; });

/* raycast taps → hotspots */
var ray=new THREE.Raycaster(), ndc=new THREE.Vector2();
function onTap(cx,cy){
  if(mode!=='explore') return;
  ndc.set(cx/window.innerWidth*2-1, -(cy/window.innerHeight)*2+1);
  ray.setFromCamera(ndc,camera);
  var hit=ray.intersectObjects(hotspots,false)[0];
  if(hit) openCard(hit.object.userData.key);
}

  {pos:[45,10,-72],tgt:[40,4,-62],dur:6500,t:'Clubhouse & Amenities',d:'Amenities modeled in place — pool, clubhouse, play court, walking track, sport court — so a buyer sees the life, not a floor plan.'},

];
var tourIdx=-1, tourT0=0, tourFrom=null;
function startTour(){
  setMode('tour'); tourIdx=-1; nextLeg();
}
function nextLeg(){
  tourIdx++;
  if(tourIdx>=tour.length){ setMode('explore'); return; }
  var L=tour[tourIdx];
  tourFrom={pos:camera.position.clone(),tgt:orbit.target.clone()};
  tourT0=performance.now();
  $('capT').textContent=L.t; $('capD').textContent=L.d;
  $('caption').classList.add('show');
  if(L.act==='build'){ $('sBuild').value=0; setConstruction(0); animateVal(0,1,L.dur*0.92,function(v){ $('sBuild').value=v*1000; setConstruction(v); updBuildLabel(v);} ); }
  if(L.act==='peel'){ animateVal(0,0.85,L.dur*0.6,function(v){ $('sPeel').value=v*1000; setPeel(v); updPeelLabel(v);} ,function(){ animateVal(0.85,0,2500,function(v){ $('sPeel').value=v*1000; setPeel(v); updPeelLabel(v);} ); }); }
  if(L.act==='sunset'){ animateVal(timeVal,0.97,L.dur*0.9,function(v){ $('sTime').value=v*1000; setTime(v); }); }
}
function tourFrame(now){
  var L=tour[tourIdx]; if(!L) return;
  var k=Math.min(1,(now-tourT0)/L.dur);
  var e=k<0.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
  camera.position.set(
    tourFrom.pos.x+(L.pos[0]-tourFrom.pos.x)*e,
    tourFrom.pos.y+(L.pos[1]-tourFrom.pos.y)*e,
    tourFrom.pos.z+(L.pos[2]-tourFrom.pos.z)*e);
  orbit.target.set(
    tourFrom.tgt.x+(L.tgt[0]-tourFrom.tgt.x)*e,
    tourFrom.tgt.y+(L.tgt[1]-tourFrom.tgt.y)*e,
    tourFrom.tgt.z+(L.tgt[2]-tourFrom.tgt.z)*e);
  camera.lookAt(orbit.target);
  if(k>=1) nextLeg();
}

/* =====================================================================
   MODES

var joy=$('joy'), joyNub=$('joyNub'), hint=$('hint');
function showHint(txt,ms){
  hint.textContent=txt; hint.classList.add('show');
  clearTimeout(showHint._t); showHint._t=setTimeout(function(){ hint.classList.remove('show'); }, ms||4200);
}
function setMode(m){
  mode=m;
  ['bExplore','bTour','bInside'].forEach(function(id){ $(id).classList.remove('on'); });
  $({explore:'bExplore',tour:'bTour',inside:'bInside'}[m]).classList.add('on');
  card.classList.remove('show');
  $('caption').classList.toggle('show', false);
  joy.style.display = (m==='inside' && 'ontouchstart' in window) ? 'block' : 'none';
  $('rail').style.display = m==='inside' ? 'none' : 'flex';
  if(m==='explore'){
    camera.fov=55; camera.updateProjectionMatrix();
    // snap orbit to current camera to avoid a jump after tour
    orbit.goal.target.copy(orbit.target);
    var off=camera.position.clone().sub(orbit.target);
    orbit.rad=orbit.goal.rad=Math.max(20,off.length());
    orbit.az=orbit.goal.az=Math.atan2(off.z,off.x);
    orbit.pol=orbit.goal.pol=Math.acos(Math.max(-1,Math.min(1,off.y/off.length())));
    showHint('Drag to orbit · pinch or scroll to zoom · tap a gold label');
  }
  if(m==='inside'){
    camera.fov=68; camera.updateProjectionMatrix();
    fp.x=1.0; fp.z=1.2; fp.yaw=3.72; fp.pitch=-0.03;
    showHint('ontouchstart' in window ? 'Joystick to walk · drag to look around' : 'W A S D to walk · drag to look around');
  }
}
$('bExplore').addEventListener('click',function(){ setMode('explore'); });
$('bTour').addEventListener('click',startTour);

/* joystick */
var joyActive=false, joyCX=0, joyCY=0;
joy.addEventListener('pointerdown',function(e){
  joyActive=true; var r=joy.getBoundingClientRect(); joyCX=r.left+r.width/2; joyCY=r.top+r.height/2;
  joy.setPointerCapture(e.pointerId); joyMove(e);
});
function joyMove(e){
  if(!joyActive) return;
  var dx=e.clientX-joyCX, dy=e.clientY-joyCY, L=Math.sqrt(dx*dx+dy*dy), max=38;
  if(L>max){ dx*=max/L; dy*=max/L; }
  joyNub.style.transform='translate(calc(-50% + '+dx+'px), calc(-50% + '+dy+'px))';
  fp.joy.x=dx/max; fp.joy.y=dy/max;
}
joy.addEventListener('pointermove',joyMove);
function joyEnd(){ joyActive=false; fp.joy.x=0; fp.joy.y=0; joyNub.style.transform='translate(-50%,-50%)'; }
joy.addEventListener('pointerup',joyEnd); joy.addEventListener('pointercancel',joyEnd);

/* first-person step + collision */
function fpStep(dt){
  var mvx=0,mvz=0;
  if(fp.keys['w']||fp.keys['arrowup'])mvz-=1;
  if(fp.keys['s']||fp.keys['arrowdown'])mvz+=1;
  if(fp.keys['a']||fp.keys['arrowleft'])mvx-=1;
  if(fp.keys['d']||fp.keys['arrowright'])mvx+=1;
  mvx+=fp.joy.x; mvz+=fp.joy.y;
  var sp=2.6*dt;
  var nx=fp.x+(Math.sin(fp.yaw)*mvz+Math.cos(fp.yaw)*mvx)*-sp;
  var nz=fp.z+(Math.cos(fp.yaw)*mvz-Math.sin(fp.yaw)*mvx)*-sp;
  // outer bounds incl. balconies
  nx=Math.max(-0.6,Math.min(9.0,nx)); nz=Math.max(-1.4,Math.min(12.0,nz));
  // wall collision: try x then z independently
  if(!hitsWall(nx,fp.z)) fp.x=nx;
  if(!hitsWall(fp.x,nz)) fp.z=nz;
  camera.position.set(fp.x,1.6,fp.z);
  var lx=fp.x-Math.sin(fp.yaw)*Math.cos(fp.pitch);
  var lz=fp.z-Math.cos(fp.yaw)*Math.cos(fp.pitch);
  camera.lookAt(lx,1.6+Math.sin(fp.pitch),lz);
}
function hitsWall(x,z){
  for(var i=0;i<wallBoxes.length;i++){
    var b=wallBoxes[i];
    if(x>b.minX&&x<b.maxX&&z>b.minZ&&z<b.maxZ) return true;
  }
  return false;
}

function updBuildLabel(v){ $('oBuild').textContent=Math.round(v*100)+'%'; }
function updPeelLabel(v){ $('oPeel').textContent=v<0.02?'Closed':(v>0.97?'Open':Math.round(v*100)+'%'); }

/* =====================================================================
   MAIN LOOP
   ===================================================================== */
window.addEventListener('resize',function(){
  camera.aspect=window.innerWidth/window.innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);
});
var last=performance.now();
function loop(now){
  requestAnimationFrame(loop);
  var dt=Math.min(0.05,(now-last)/1000); last=now;
  // value animations
  for(var i=anims.length-1;i>=0;i--){
    var A=anims[i], k=Math.min(1,(now-A.t0)/A.dur);
    A.fn(A.from+(A.to-A.from)*(k<0.5?2*k*k:1-Math.pow(-2*k+2,2)/2));
    if(k>=1){ anims.splice(i,1); if(A.done)A.done(); }
  }
  groundTex.offset.x+=0;   // (reserved)
  poolWaterM.opacity=0.8+Math.sin(now*0.002)*0.05;
  if(crane.visible) craneTop.rotation.y=now*0.00008;
  if(mode==='inside'){ fpStep(dt); renderer.render(home,camera); return; }
  if(mode==='tour'){ tourFrame(now); } else { applyOrbit(); }
  hotspots.forEach(function(h){ h.position.y+=Math.sin(now*0.0016+h.position.x)*0.004; });
  renderer.render(world,camera);
}

window.SSR={focusOn:focusOn,openCard:openCard,setMode:setMode};
/* init */
setConstruction(0.62); updBuildLabel(0.62);
setPeel(0); updPeelLabel(0);
setTime(0.38);
applyOrbit();
requestAnimationFrame(loop);
setTimeout(function(){ $('splash').classList.add('gone'); showHint('Drag to orbit · pinch or scroll to zoom · tap a gold label'); },900);
})();
